; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:seeed_xiao_esp32s3]
; pioarduino and not "espressif32": the official platform stopped at Arduino
; 2.0.17 (IDF 4.4), which has no driver/i2s_std.h. This fork tracks Arduino 3.x.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

lib_deps =
    bblanchon/ArduinoJson@^6.21.0
build_flags =
    -DBOARD_HAS_PSRAM
; Regenerates lib/Setup/setup_page.h from bonsai-setup.html before every build,
; so the setup page is embedded in flash and works with a blank SD card.
extra_scripts =
    pre:scripts/embed_setup_page.py
