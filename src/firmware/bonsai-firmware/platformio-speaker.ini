; SPEAKER BENCH CONFIG — not the shipped firmware. The tracked platformio.ini
; is untouched.
;
;     pio run -c platformio-speaker.ini -e speaker_test -t upload -t monitor
;
; src_dir points at local_bench/speaker/ and nowhere else, so this build and the
; other two cannot see each other: the tracked env compiles src/main.cpp, the
; camera bench compiles local_bench/, and this one compiles the speaker sketch.
; Sharing a src_dir would put two setup()/loop() pairs in front of the linker.
;
; lib/Audio is not compiled here either — nothing includes Audio.h. The sketch
; drives GPIO8 itself, which is the microSD's MISO pin, and it never mounts the
; card so there is no driver to fight over it.
;
; No lib_deps: no ArduinoJson, no WiFi, no camera. Just I2S and a sine wave.

[platformio]
src_dir = local_bench/speaker

[env:speaker_test]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino
board_build.arduino.memory_type = qio_opi

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

build_flags =
    -DBOARD_HAS_PSRAM
